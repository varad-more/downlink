# Downlink -- Phase 1 (tap only). Phases 2-4 add services to this file.
#
# Every capability below is load-bearing. Omit one and the failure is an
# opaque -EPERM or -EINVAL from bpf(2) with no diagnostic:
#
#   network_mode: host      the clsact qdisc lives on a host netdev; a bridged
#                           container has no route to it
#   CAP_BPF                 bpf(2) BPF_PROG_LOAD / MAP_CREATE  (kernel >= 5.8)
#   CAP_PERFMON             required alongside CAP_BPF for programs that read
#                           packet data on some kernels; cheap insurance
#   CAP_NET_ADMIN           required to load BPF_PROG_TYPE_SCHED_CLS and to
#                           talk netlink/tc to create and attach the filters
#   seccomp=unconfined      Docker's DEFAULT seccomp profile permits bpf(2)
#                           only for CAP_SYS_ADMIN. Adding CAP_BPF alone is
#                           not enough -- the syscall is filtered before the
#                           capability check. This is the single most common
#                           reason "I added the caps and it still fails".
#   ulimits.memlock: -1     only needed on kernel < 5.11, where BPF memory is
#                           charged against RLIMIT_MEMLOCK instead of the
#                           cgroup memory controller
#   /sys/fs/bpf             not used in Phase 1 (nothing is pinned; the tc
#                           filter holds the program reference). Mounted now
#                           so pinning is a config change, not a rebuild.
#
# If this still fails on your host, try `privileged: true` to confirm it is a
# permission problem, then narrow again -- do not ship privileged.
# On Ubuntu hosts you may also need `apparmor=unconfined` in security_opt.

x-tap-runtime: &tap-runtime
  build: ./tap
  network_mode: host
  cap_add: [BPF, PERFMON, NET_ADMIN]
  security_opt:
    - seccomp=unconfined
  ulimits:
    memlock: -1
  volumes:
    - /sys/fs/bpf:/sys/fs/bpf:rw

services:
  tap:
    <<: *tap-runtime
    restart: unless-stopped
    command:
      - --iface
      # Not `:?` -- compose interpolates the whole file even when running a
      # single service, so a hard guard here would break `make verify-phase1`
      # on a machine with no .env. The sentinel fails at if_nametoindex(3).
      - ${DOWNLINK_WAN_IFACE:-SET_DOWNLINK_WAN_IFACE_IN_DOT_ENV}
      - --window-ms
      - ${DOWNLINK_RL_WINDOW_MS:-5000}
      # The loader is the forwarder: eBPF cannot write to a socket, so the
      # ring buffer consumer pushes the same lines it prints to the stream
      # server. host networking means the stream's published port is local.
      - --sink
      - 127.0.0.1:9000

  # Phase 1 gate. Same image, same bytecode, no NIC touched.
  replay:
    <<: *tap-runtime
    profiles: [tools]
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - ./tests:/tests:ro
    command:
      - --replay
      - /tests/sample.pcap
      - --local
      - 192.168.1.0/24

  # ---------------- Phase 2: topology engine ----------------

  db:
    build: ./topo
    environment:
      POSTGRES_DB: downlink
      POSTGRES_PASSWORD: ${PGPASSWORD:-downlink}
    volumes:
      - ./topo/sql:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d downlink"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [downlink]

  resolver:
    build: ./resolver
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGPASSWORD: ${PGPASSWORD:-downlink}
      DOWNLINK_HOME_LAT: ${DOWNLINK_HOME_LAT:-33.4255}
      DOWNLINK_HOME_LON: ${DOWNLINK_HOME_LON:--111.9400}
      DOWNLINK_GEO_FIXTURE: /tests/fixture_dests.json
      # Set to a mounted .mmdb to use real MaxMind data instead of the fixture.
      DOWNLINK_GEOIP_DB: ${DOWNLINK_GEOIP_DB:-}
    volumes:
      - ./tests:/tests:ro
      - ./data:/data:ro
    ports: ["127.0.0.1:8081:8081"]
    networks: [downlink]

  # One-shot: load cable data and build the graph. `make load-topo`.
  topo-load:
    build: ./resolver
    profiles: [tools]
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGPASSWORD: ${PGPASSWORD:-downlink}
      DOWNLINK_DATA_DIR: /data
      DOWNLINK_LAND_GEOJSON: /basemap/ne_110m_land.geojson
    volumes:
      - ./tests:/tests:ro
      - ./data:/data:ro
      - ./phase4/public/basemap:/basemap:ro
    command: ["python", "-u", "load_cables.py"]
    networks: [downlink]

  # ---------------- Phase 3: stream ----------------

  stream:
    build: ./stream
    depends_on: [resolver]
    environment:
      RESOLVER_URL: http://resolver:8081
    ports: ["127.0.0.1:9000:9000", "9001:9001", "127.0.0.1:9002:9002"]
    restart: unless-stopped
    networks: [downlink]

  loadtest:
    build: ./stream
    profiles: [tools]
    depends_on: [stream]
    environment:
      STREAM_HOST: stream
    command: ["node", "dist/loadtest.js",
              "--minutes", "${LOADTEST_MINUTES:-10}",
              "--rate", "${LOADTEST_RATE:-500}",
              "--clients", "3"]
    networks: [downlink]

  # ---------------- Phase 4: projection ----------------

  kiosk:
    build: ./phase4
    depends_on: [stream]
    ports: ["8080:80"]
    restart: unless-stopped
    networks: [downlink]

networks:
  downlink:

volumes:
  dbdata:
